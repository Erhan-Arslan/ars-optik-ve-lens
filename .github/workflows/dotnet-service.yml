name: .NET service

on:
  push:
    branches: [main]
    paths:
      - "dotnet-service/**"
      - ".github/workflows/dotnet-service.yml"
  pull_request:
    paths:
      - "dotnet-service/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet-service/global.json

      - run: dotnet test
