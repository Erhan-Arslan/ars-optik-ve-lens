services:
  - type: web
    name: ars-optik-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
    envVars:
      # Neon PostgreSQL (Render free DB expires after 30 days); value is set in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "https://erhan-arslan.github.io"
      # Live admin notifications: order events are pushed to the .NET service's SignalR hub.
      - key: DOTNET_SERVICE_URL
        value: "https://ars-optik-dotnet.onrender.com"
      - key: INTERNAL_API_KEY
        generateValue: true

  - type: web
    name: ars-optik-dotnet
    runtime: docker
    dockerfilePath: ./dotnet-service/Dockerfile
    dockerContext: ./dotnet-service
    plan: free
    healthCheckPath: /health
    buildFilter:
      paths:
        - dotnet-service/**
    envVars:
      # Same Neon database as the backend (read-only use); set in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # Validates the backend's tokens, so it must be the backend's secret.
      - key: JWT_ACCESS_SECRET
        fromService:
          type: web
          name: ars-optik-backend
          envVarKey: JWT_ACCESS_SECRET
      - key: CORS_ORIGIN
        value: "https://erhan-arslan.github.io"
      # Shared with the backend, which authenticates its order events with it.
      - key: INTERNAL_API_KEY
        fromService:
          type: web
          name: ars-optik-backend
          envVarKey: INTERNAL_API_KEY
      # Order e-mails via Brevo's HTTPS API (Render's free plan blocks outbound SMTP).
      # Without these the service logs instead of sending. Set in the Render dashboard.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: SITE_URL
        value: "https://erhan-arslan.github.io/ars-optik-ve-lens"
